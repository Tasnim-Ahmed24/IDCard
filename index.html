<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identity Card - Tasnim Omar Nahali</title>
  
  <style>
    :root {
      /* Palette & Colors */
      --color-primary: #1A365D;      /* Deep Elegant Blue */
      --color-primary-light: #2B6CB0;
      --color-beige-bg: #FAF6F0;     /* Warm Soft Beige Card Base */
      --color-beige-card: #F5EBE0;
      --color-accent: #EE3A23;       /* Requested Accent Red */
      --color-text-main: #0F172A;    /* Dark Navy/Charcoal */
      --color-text-sub: #475569;     /* Slate Muted */
      --color-disabled: #CBD5E1;   /* Disabled Social Icons */
      
      /* Card Physical Dimensions (CR80 Standard Bank Card Size) */
      --card-width: 85.6mm;
      --card-height: 54mm;
      --card-radius: 3.2mm;          /* Standard corner radius */
      
      /* Shadow & Sheen Properties */
      --card-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.25), 0 0 1px rgba(0, 0, 0, 0.1);
      --card-border-glow: rgba(255, 255, 255, 0.6);
      
      /* Typography */
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Reset & Base Layout */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: #E2E8F0;
      background-image: radial-gradient(circle at 50% 50%, #F1F5F9 0%, #CBD5E1 100%);
      color: var(--color-text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      perspective: 1000px; /* 3D Tilt perspective */
      -webkit-font-smoothing: antialiased;
    }

    /* Container maintaining physical proportions with scale-down fallback for small screens */
    .scene {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      width: 100%;
      max-width: 500px;
    }

    .card-wrapper {
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.15s cubic-bezier(0.2, 0, 0.4, 1);
      will-change: transform;
    }

    /* Standard Card Box */
    .id-card {
      width: var(--card-width);
      height: var(--card-height);
      background: linear-gradient(135deg, var(--color-beige-bg) 0%, var(--color-beige-card) 100%);
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      position: relative;
      overflow: hidden;
      display: flex;
      padding: 3.5mm 4mm;
      border: 0.3mm solid rgba(255, 255, 255, 0.8);
      /* Light rim highlight */
      box-shadow: 
        var(--card-shadow),
        inset 0 1px 1px var(--card-border-glow);
    }

    /* Surface Sheen Layer */
    .id-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 200%;
      height: 100%;
      background: linear-gradient(
        115deg,
        transparent 0%,
        rgba(255, 255, 255, 0) 40%,
        rgba(255, 255, 255, 0.25) 50%,
        rgba(255, 255, 255, 0) 60%,
        transparent 100%
      );
      pointer-events: none;
      transform: translateY(0);
      transition: opacity 0.3s ease;
    }

    /* Accent Design Ribbon on Top Right */
    .card-accent-strip {
      position: absolute;
      top: 0;
      right: 0;
      width: 18mm;
      height: 2.5mm;
      background: var(--color-accent);
      border-bottom-left-radius: 2mm;
    }

    .card-brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1.2mm;
      background: linear-gradient(90deg, var(--color-primary) 0%, var(--color-accent) 100%);
    }

    /* Left Column: Portrait & Title */
    .card-left {
      width: 32mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-right: 2.5mm;
      border-right: 0.2mm solid rgba(30, 54, 93, 0.12);
      flex-shrink: 0;
    }

    .photo-container {
      width: 17.5mm;
      height: 17.5mm;
      border-radius: 2mm;
      overflow: hidden;
      background-color: var(--color-primary);
      box-shadow: 0 1.5mm 3mm rgba(0,0,0,0.15);
      border: 0.4mm solid #FFFFFF;
      position: relative;
      margin-bottom: 1.5mm;
      flex-shrink: 0;
    }

    .photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Initials Fallback if Photo Fails */
    .avatar-fallback {
      display: none;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--color-primary) 0%, #0F172A 100%);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 6.5pt;
      letter-spacing: 0.5px;
      align-items: center;
      justify-content: center;
    }

    .user-name {
      font-size: 6.8pt;
      font-weight: 800;
      color: var(--color-primary);
      line-height: 1.15;
      margin-bottom: 0.8mm;
      letter-spacing: -0.1px;
      text-transform: uppercase;
    }

    .user-title {
      font-size: 5pt;
      font-weight: 700;
      color: var(--color-accent);
      line-height: 1.1;
      margin-bottom: 0.4mm;
      text-transform: uppercase;
    }

    .user-org {
      font-size: 4.5pt;
      font-weight: 600;
      color: var(--color-text-sub);
      line-height: 1.1;
    }

    /* Right Column: Contact Info & Social Links */
    .card-right {
      flex: 1;
      padding-left: 3mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 1.6mm;
      margin-top: 1mm;
    }

    .contact-item {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      border-radius: 1mm;
      transition: background-color 0.2s ease;
    }

    .contact-item:focus-visible {
      outline: 1.5px solid var(--color-accent);
      outline-offset: 1px;
    }

    .contact-label {
      font-size: 3.5pt;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--color-accent);
      line-height: 1;
      margin-bottom: 0.3mm;
    }

    .contact-value {
      font-size: 5.2pt;
      font-weight: 600;
      color: var(--color-text-main);
      line-height: 1.1;
      word-break: break-word;
    }

    /* Interactive links hover state */
    a.contact-item:hover .contact-value {
      color: var(--color-primary-light);
      text-decoration: underline;
    }

    .social-row {
      display: flex;
      align-items: center;
      gap: 2mm;
      margin-bottom: 0.5mm;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 5.5mm;
      height: 5.5mm;
      border-radius: 50%;
      background-color: rgba(26, 54, 147, 0.08);
      color: var(--color-primary);
      text-decoration: none;
      transition: all 0.2s ease;
      /* Ensure minimum physical touch target size on screen through transparent padding wrapper */
      position: relative;
    }

    .social-link svg {
      width: 3.2mm;
      height: 3.2mm;
      fill: currentColor;
    }

    .social-link:not(.disabled):hover {
      background-color: var(--color-primary);
      color: #FFFFFF;
      transform: translateY(-0.5px);
    }

    .social-link:focus-visible {
      outline: 1.5px solid var(--color-accent);
      outline-offset: 1px;
    }

    .social-link.disabled {
      color: var(--color-disabled);
      background-color: rgba(203, 213, 225, 0.25);
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* Control Toolbar under the Card */
    .controls {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-print {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: var(--color-primary);
      color: #FFFFFF;
      border: none;
      padding: 0.75rem 1.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(26, 54, 93, 0.25);
      transition: all 0.2s ease;
      min-height: 44px; /* Minimum accessibility tap target height */
      min-width: 44px;
    }

    .btn-print:hover {
      background-color: #0F172A;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.35);
      transform: translateY(-1px);
    }

    .btn-print:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 3px;
    }

    .btn-print svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .hint-text {
      font-size: 0.8rem;
      color: var(--color-text-sub);
    }

    @media (max-width: 420px) {
      .scene {
        zoom: 0.9; /* Fluid scaling on narrow devices */
      }
      
      /* Enforce 44px touch targets on screen for interactive items */
      .contact-item {
        min-height: 44px;
        justify-content: center;
      }
      
      .social-link {
        min-width: 44px;
        min-height: 44px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card-wrapper {
        transition: none !important;
        transform: none !important;
      }
      .btn-print {
        transition: none !important;
      }
    }

    @media print {
      @page {
        size: 85.6mm 54mm;
        margin: 0;
      }

      html, body {
        width: 85.6mm;
        height: 54mm;
        background: none !important;
        padding: 0 !important;
        margin: 0 !important;
        display: block !important;
      }

      .controls, .hint-text {
        display: none !important;
      }

      .scene {
        padding: 0 !important;
        margin: 0 !important;
        width: 85.6mm !important;
        height: 54mm !important;
      }

      .card-wrapper {
        transform: none !important;
      }

      .id-card {
        border: none !important;
        box-shadow: none !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      /* Adjust touch target minimums back to exact print layout */
      .contact-item {
        min-height: auto;
      }
      .social-link {
        min-width: auto;
        min-height: auto;
      }
    }
  </style>

  <script>
    /**
     * Fallback mechanism for photo loading errors.
     * Hides image element and displays initial letters in a stylized container.
     */
    function handleImageError() {
      const img = document.getElementById('userPhoto');
      const fallback = document.getElementById('avatarFallback');
      if (img && fallback) {
        img.style.display = 'none';
        fallback.style.display = 'flex';
      }
    }

    /**
     * 3D Physics Tilt Effect
     * Adds subtle physical responsiveness as the user moves mouse over the card.
     */
    (function initTiltEffect() {
      const scene = document.getElementById('scene');
      const cardWrapper = document.getElementById('cardWrapper');
      
      // Respect user setting for reduced motion
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReducedMotion || !scene || !cardWrapper) return;

      let bounds;

      function updateBounds() {
        bounds = scene.getBoundingClientRect();
      }

      scene.addEventListener('mouseenter', updateBounds);

      scene.addEventListener('mousemove', (e) => {
        if (!bounds) updateBounds();
        
        // Calculate mouse relative coordinates (-1 to 1)
        const mouseX = e.clientX - bounds.left;
        const mouseY = e.clientY - bounds.top;
        
        const xPct = (mouseX / bounds.width) - 0.5;
        const yPct = (mouseY / bounds.height) - 0.5;
        
        // Subtle tilt angles (max ~8 degrees)
        const rotateX = (-yPct * 16).toFixed(2);
        const rotateY = (xPct * 16).toFixed(2);
        
        cardWrapper.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
      });

      scene.addEventListener('mouseleave', () => {
        cardWrapper.style.transform = 'rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
      });
    })();
  </script>
